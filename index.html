<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAVDRIFT-0</title>
<style>
  html,body{margin:0;padding:0;background:#05070c;height:100%}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#8aa0c8;font-size:13px;letter-spacing:.04em}
  noscript{color:#8aa0c8;font-family:sans-serif;padding:24px;display:block}
</style>
</head>
<body>
<div id="boot">NAVDRIFT-0 — loading…</div>
<noscript>
  <p>JavaScript is required. Open the mobile app directly at <a href="frontend/mobile.html">frontend/mobile.html</a>,
  or the desktop dashboard at <a href="frontend/desktop.html">frontend/desktop.html</a>.</p>
</noscript>
<script>
(function(){
  // Thin device router only. No navigation logic, no simulated data, no new features —
  // this file's only job is deciding which existing, unmodified application to load:
  //   phone / tablet  -> frontend/mobile.html   (real sensors, real GNSS, live nav pipeline)
  //   desktop / laptop -> frontend/desktop.html (ISRO Mission Control dashboard)
  //
  // Bug fix (real laptop misrouted to /mobile): a touchscreen Windows laptop with OS display
  // scaling (e.g. a high-DPI panel at 200-250% scaling) can report a CSS viewport width well
  // under 900px even though the physical screen is a normal wide laptop panel — scaling
  // compresses innerWidth/screen.width, not just physical pixels. The old logic used
  // touch + narrow-viewport as sole evidence, so a scaled touchscreen laptop satisfied
  // "hasTouch && narrowViewport" exactly like a real phone and got misrouted.
  //
  // Fix: device identity now takes priority over touch/viewport, per this order:
  //   1. navigator.userAgentData.mobile, when the browser exposes it (all Chromium/Edge —
  //      the vast majority of Windows laptops) — this is computed by the browser from the
  //      underlying OS, is NOT affected by display scaling, touch hardware, or window size,
  //      and is authoritative in both directions: mobile:true -> mobile, mobile:false -> desktop.
  //   2. Only when userAgentData is unavailable (Safari/iPadOS, older Firefox) do we fall back
  //      to the previous heuristic — touch + (narrow viewport or mobile UA string), or coarse
  //      pointer + narrow viewport — unchanged from before, so existing iPhone/iPad/Android
  //      routing behavior is not affected.

  function isMobileDevice(){
    var uad = navigator.userAgentData;
    if (uad && typeof uad.mobile === 'boolean') {
      return uad.mobile;
    }

    var coarsePointer = false;
    try { coarsePointer = window.matchMedia && window.matchMedia('(pointer: coarse)').matches; } catch(e) {}

    var hasTouch = (navigator.maxTouchPoints || 0) > 0 || ('ontouchstart' in window);

    var narrowViewport = Math.min(window.innerWidth || 9999, window.screen ? window.screen.width || 9999 : 9999) <= 900;

    var uaMobile = /Android|iPhone|iPad|iPod|Windows Phone|Mobile/i.test(navigator.userAgent || '');

    // Require touch capability AND (a narrow viewport OR a mobile UA string).
    // A touch-capable desktop monitor with a wide viewport and a desktop UA stays on desktop.
    if (hasTouch && (narrowViewport || uaMobile)) return true;
    if (coarsePointer && narrowViewport) return true;
    return false;
  }

  var target = isMobileDevice() ? 'frontend/mobile.html' : 'frontend/desktop.html';
  window.location.replace(target);
})();
</script>
</body>
</html>
